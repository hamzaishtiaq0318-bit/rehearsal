# Rehearsal as automated testing for an AI agent: whenever the agent's prompt, model chain or tools
# change, run it through rehearsals and fail the build if it mishandles a ticket or falls for an attack.
# Every rehearsal is rejected afterwards, so nothing is ever applied. Needs a GROQ_API_KEY secret.

name: agent check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - rehearsal/agent.py
      - rehearsal/llm.py
      - legacy/kestrel_desk/synapse_auto_server*.py

permissions:
  contents: read

jobs:
  agent:
    name: The agent handles every ticket and resists every attack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Six story tickets, graded against the refund policy
        if: env.GROQ_API_KEY != ''
        run: python -m rehearsal.evaluate --providers groq --check
      - name: Seven attacks, flagged by Rehearsal and resisted by the model
        if: env.GROQ_API_KEY != ''
        run: python -m rehearsal.gallery --model --check
      - name: Without a key, only Rehearsal's own catches are checked
        if: env.GROQ_API_KEY == ''
        run: python -m rehearsal.gallery --check
