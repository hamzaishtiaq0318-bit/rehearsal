# Which existing app Rehearsal protects, and how to run copies of it.
# Point these at another Synapse-built app to protect that one instead.

runtime_dir = "runtime"

[target]
name = "Kestrel Desk"
app_dir = "legacy/kestrel_desk"
command = ["{python}", "-m", "uvicorn", "main:app", "--host", "127.0.0.1", "--port", "{port}"]
health_path = "/health"
database_env = "KESTREL_DB"
live_database = "runtime/live/kestrel.db"
seed_command = ["{python}", "seed.py", "{database}"]
live_port = 8100
# Columns that legitimately differ between a rehearsal and its replay.
volatile_columns = ["created_at"]
# Every changed row is traced through foreign keys to its owner in this table.
owner_table = "customers"

# Tables whose new rows mean money leaving the business, and the column holding the amount in cents.
[target.money]
refunds = "amount_cents"
credits = "amount_cents"

# Tables whose new rows are text sent outside the business, and the column holding the text.
# Rehearsal checks the money a reply talks about against the money that actually moves.
[target.outbound]
messages = "body"

# Columns holding personal data. Outbound text carrying another customer's values is flagged as a leak.
[target.private]
customers = ["email", "name"]

[risk]
single_payment_limit_cents = 50000
bulk_rows = 5

# Your own business rules. Breaking any of them is high risk, so a person always decides.
#   never_change     "table" or "table.column" no task may change
#   protected        owner ids no task may touch, for example VIP customers
#   max_money_cents  the most one task may pay out in total
#   max_money_per_owner_per_day_cents  the most one customer may receive in a day, across every task
[rules]
never_change = ["customers.email", "orders.total_cents"]
max_money_cents = 100000
max_money_per_owner_per_day_cents = 50000

# "low": a rehearsal that raises no flag at all (no money, one customer, nothing unusual) is applied
# without asking. It is still verified against the rehearsal, logged and undoable.
# "none": a person approves every change.
[trust]
auto_apply = "low"
# second_approval = "high"   # high risk work needs two reviewers, each with their own link (REHEARSAL_REVIEWERS)

# How each write tool is described to the reviewer, in plain words. Tools not listed get a generic sentence.
[phrases]
refund_order = "Refund {amount} USD on order {order_id}"
add_store_credit = "Add {amount} USD store credit for customer {customer_id}"
reply_to_ticket = "Reply to the customer on ticket {ticket_id}"
update_ticket = "Update ticket {ticket_id}"
